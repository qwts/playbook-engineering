# Synchronize the centrally managed agent-harness environment to every active
# governed repository through chores-dumb-authored pull requests.
name: Governed harness sync

on:
  push:
    branches: [main]
    # Every governed source root, so a change to any synced file propagates on
    # merge instead of waiting for the weekly repair run. Must cover the
    # governed harness manifest — the codex-sync test asserts that it does,
    # because a path missing here is a fix that silently does not ship (the
    # guard fixes #197–#205 sat on main unsynced because tools/agent-guard/**
    # was absent from this list).
    paths:
      - '.prettierignore'
      - '.codex/**'
      - '.claude/settings.json'
      - '.cursor/hooks.json'
      - '.github/workflows/codex-sync.yml'
      - 'governance/repos.json'
      - 'governance/agent-models.json'
      - 'tools/agent-guard/**'
      - 'tools/models/**'
      - 'tools/repos/lib/agent-bot-client.mjs'
      - 'tools/repos/lib/baseline-files.mjs'
      - 'tools/repos/lib/codex-sync.mjs'
      - 'tools/repos/lib/manifest.mjs'
      - 'tools/repos/sync-codex.mjs'
  workflow_dispatch:
    inputs:
      repo:
        description: Optional active governed repository to synchronize
        required: false
        type: string
  schedule:
    # Weekly repair run after the Monday fleet inventory.
    - cron: '30 6 * * 1'

permissions:
  contents: read

concurrency:
  group: governed-codex-sync
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: qwts/playbook-engineering/.github/actions/ci-policy@4e70c773155c2c804e52a487352627010bea1897
        with:
          authorization-only: 'true'

  sync:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint the chores-dumb token
        id: chores
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Synchronize managed harness files
        env:
          CODEX_SYNC_REPO: ${{ inputs.repo }}
          GH_TOKEN: ${{ steps.chores.outputs.token }}
        run: node tools/repos/sync-codex.mjs --apply --json
