name: CI policy
description: Authorize governed workflow actors and classify CI lifecycle runs.

inputs:
  authorization-only:
    description: Enforce actor and fork policy without classifying a CI lifecycle lane
    required: false
    default: 'false'

outputs:
  mode:
    description: full, queue, post-merge, or manual
    value: ${{ steps.classify.outputs.mode }}
  run_full:
    description: Whether the complete validation lane must run
    value: ${{ steps.classify.outputs.run_full }}
  run_post_merge:
    description: Whether the short post-merge lane must run
    value: ${{ steps.classify.outputs.run_post_merge }}

runs:
  using: composite
  steps:
    - id: classify
      name: Enforce actor and classify lifecycle event
      shell: bash
      env:
        CI_POLICY_ACTOR: ${{ github.actor }}
        CI_POLICY_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        CI_POLICY_EVENT_NAME: ${{ github.event_name }}
        CI_POLICY_EVENT_PATH: ${{ github.event_path }}
        CI_POLICY_REF: ${{ github.ref }}
        CI_POLICY_AUTHORIZATION_ONLY: ${{ inputs.authorization-only }}
      run: node "${{ github.action_path }}/classify.mjs"
